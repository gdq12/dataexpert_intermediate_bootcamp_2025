version: 2

sources:
  - name: bootcamp
    database: "{{ env_var('DBT_DB') }}"
    schema: "{{ env_var('DBT_SCHEMA') }}"
    tables:
      - name: js_raw_orders
      - name: js_raw_payments
      - name: js_raw_customers
        freshness:
          warn_after:
            count: 365 # 1 year
            period: day
          error_after:
            count: 1095 # 3 years
            period: day
        loaded_at_field: "cast(last_updated_dt as timestamp)"